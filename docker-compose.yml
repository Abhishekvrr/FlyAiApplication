version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cdp_postgres
    environment:
      POSTGRES_USER: cdp_admin
      POSTGRES_PASSWORD: cdp_secure_pass
      POSTGRES_DB: cdp_platform
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp_admin -d cdp_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cdp_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
